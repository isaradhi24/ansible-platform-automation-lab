---
- name: Configure baseline packages
  hosts: docker_nodes
  gather_facts: false

  tasks:
    - name: check application directory
      ansible.builtin.stat:
        path: /opt/ansible-app 
      register: app_directory 

    - name: Display application directory status
      ansible.builtin.debug:
        msg: "Application directory exists: {{ app_directory.stat.exists }}"

    - name: Create application directory if it does not exist
      ansible.builtin.file:
        path: /opt/ansible-app
        state: directory
        mode: '0755'
      when: not app_directory.stat.exists

    - name: Recheck application directory
      ansible.builtin.stat:
        path: /opt/ansible-app
      register: app_directory_after

    - name: Validate application directory
      ansible.builtin.assert:
        that:
          - app_directory_after.stat.exists
          - app_directory_after.stat.isdir
        success_msg: "Application directory validated successfully"
        fail_msg: "Application directory validation failed"